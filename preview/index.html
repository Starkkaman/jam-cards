<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jam Cards preview</title>
<!-- Mimics a sections dashboard with the Hi-Fi theme (looks.css). ?mode=light switches to Day; ?theme=none leaves the theme
     off (HA's default theme: the cards draw their built-in Hi-Fi Night palette). ?theme=Hi-Fi%20Day / Hi-Fi%20Night (1.0.1)
     applies that single-mode theme (preview/themes.js) inline on <html> as HA does, instead of looks.css; ?dark=1 / 0 sets
     hass.themes.darkMode (and the .light class) independently of it, so a check can make them disagree. -->
<link rel="stylesheet" href="looks.css" id="theme-css"> <!-- GENERATED from tokens/ by tools/bundle.mjs: the Hi-Fi theme tokens per mode -->
<style>
  html,body{margin:0;background:var(--primary-background-color)}
  /* HA's hui-view-background: a look's lovelace-background (Grid: the page grid) on a layer behind everything in body (the
     whole page, so full-page shots show it; body is a stacking context, so the layer sits above its background); unset = none. */
  body{position:relative;z-index:0;min-height:100vh}
  body::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--lovelace-background,none)}
  .view{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .sec{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-content:start}
  .sec > *{grid-column:span 12} .sec > .half{grid-column:span 6}
  .wide{grid-column:span 2} @media (max-width:700px){.wide{grid-column:span 1}}
  .full{grid-column:1/-1}
</style>
<script src="themes.js"></script> <!-- GENERATED from tokens/: hass.themes.themes (the Hi-Fi theme) -->
<script>
{ const q = new URLSearchParams(location.search), th = q.get("theme"), one = th && th !== "none" && (window.jamPreviewThemes || {})[th];
  if (th === "none" || one) document.getElementById("theme-css").remove();
  // a single-mode theme (no modes): every key as a custom property on <html> (HA: applyThemesOnElement on documentElement)
  if (one && !one.modes) for (const [k, v] of Object.entries(one)) document.documentElement.style.setProperty("--" + k, v);
  window.__singleTheme = one && !one.modes ? th : ""; }
</script>
<script src="../dist/jam-cards.js"></script> <!-- GENERATED bundle; look fonts in ../dist/fonts/ -->
</head>
<body>
<div class="view" id="view"></div>
<script>
if (new URLSearchParams(location.search).get("mode") === "light" || new URLSearchParams(location.search).get("dark") === "0") document.documentElement.classList.add("light");
const lookParam = new URLSearchParams(location.search).get("theme") === "none" ? "" : "hifi";
const now = new Date().toISOString();
const states = {}, layout = [];
// Fixture API (preview/fixtures/*.js, loaded in name order by fixtures/index.js):
//   jamPreview.add({states: [st(...)], sections: [[cls, card | [card | [cls, card]]]]})
//   jamPreview.room(accent, items): gives every card in a section's item list that accent, unless it sets accent or color.
window.jamPreview = {
  st: (entity_id, state, attributes = {}) => ({entity_id, state, attributes, last_changed: now, last_updated: now}),
  room: (accent, items) => items.map(it => {
    const [cls, c] = Array.isArray(it) ? it : [null, it];
    const out = c.accent || c.color ? c : {...c, accent};
    return cls === null ? out : [cls, out];
  }),
  add({states: s = [], sections = []}) { s.forEach(x => states[x.entity_id] = x); layout.push(...sections); },
};
</script>
<script src="fixtures/index.js"></script>
<script>
window.__calls = [];
const hass = {
  states,
  callService(domain, service, data, target) { window.__calls.push({domain, service, data, target}); return Promise.resolve(); },
  formatEntityState(s) { const u = s.attributes.unit_of_measurement; return u ? `${s.state} ${u}` : s.state; },
};
// hass.themes like HA's: the Hi-Fi theme (preview/themes.js), active unless ?theme=none; selectedTheme = the browser's pick
// (Profile -> Theme). A `settheme` event is only recorded in window.__settheme.
// ?theme=<single-mode theme> (1.0.1): that theme is the default theme (frontend.set_theme), darkMode stays the device's (?dark).
const pageTheme = window.__singleTheme || (lookParam ? (window.jamPreviewLookThemes || {})[lookParam] || "" : "");
hass.themes = {darkMode: !document.documentElement.classList.contains("light"), default_theme: window.__singleTheme || "default", default_dark_theme: null,
  themes: window.jamPreviewThemes || {}, theme: pageTheme || "default"};
hass.selectedTheme = pageTheme && !window.__singleTheme ? {theme: pageTheme} : null; // a kiosk on the default theme picked nothing
window.__settheme = [];
window.addEventListener("settheme", e => { window.__settheme.push(e.detail); });
window.__hass = hass;
const view = document.getElementById("view");
const mk = (cfg, cls) => { const e = document.createElement(cfg.type.replace("custom:", "")); e.setConfig(cfg); e.hass = hass; if (cls) e.className = cls; return e; };
// ?view=none: states + hass only, no cards (preview/checks/97-robust.js mounts its own on a clean page).
if (new URLSearchParams(location.search).get("view") !== "none") for (const [cls, item] of layout) {
  if (!Array.isArray(item)) { view.append(mk(item, cls)); continue; }
  const sec = document.createElement("div"); sec.className = "sec " + cls;
  for (const it of item) sec.append(Array.isArray(it) ? mk(it[1], it[0]) : mk(it));
  view.append(sec);
}
window.__ready = true;
</script>
</body>
</html>
