<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jam Cards preview</title>
<!-- Mimics a sections dashboard with the JamBoard theme (looks.css). ?mode=light switches to the paper palette. -->
<link rel="stylesheet" href="looks.css"> <!-- GENERATED from tokens/ by tools/bundle.mjs: the JamBoard theme tokens per mode -->
<style>
  html,body{margin:0;background:var(--primary-background-color)}
  .view{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .sec{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-content:start}
  .sec > *{grid-column:span 12} .sec > .half{grid-column:span 6}
  .wide{grid-column:span 2} @media (max-width:700px){.wide{grid-column:span 1}}
  .full{grid-column:1/-1}
</style>
<script src="../jam-cards.js"></script>
</head>
<body>
<div class="view" id="view"></div>
<script>
if (new URLSearchParams(location.search).get("mode") === "light") document.documentElement.classList.add("light");
const now = new Date().toISOString();
const states = {}, layout = [];
// Fixture API (preview/fixtures/*.js, loaded in name order by fixtures/index.js):
//   jamPreview.add({states: [st(...)], sections: [[cls, card | [card | [cls, card]]]]})
//   jamPreview.room(accent, items): gives every card in a section's item list that accent, unless it sets accent or color.
window.jamPreview = {
  st: (entity_id, state, attributes = {}) => ({entity_id, state, attributes, last_changed: now, last_updated: now}),
  room: (accent, items) => items.map(it => {
    const [cls, c] = Array.isArray(it) ? it : [null, it];
    const out = c.accent || c.color ? c : {...c, accent};
    return cls === null ? out : [cls, out];
  }),
  add({states: s = [], sections = []}) { s.forEach(x => states[x.entity_id] = x); layout.push(...sections); },
};
</script>
<script src="fixtures/index.js"></script>
<script>
window.__calls = [];
const hass = {
  states,
  callService(domain, service, data, target) { window.__calls.push({domain, service, data, target}); return Promise.resolve(); },
  formatEntityState(s) { const u = s.attributes.unit_of_measurement; return u ? `${s.state} ${u}` : s.state; },
};
hass.themes = {darkMode: !document.documentElement.classList.contains("light")};
window.__hass = hass;
const view = document.getElementById("view");
const mk = (cfg, cls) => { const e = document.createElement(cfg.type.replace("custom:", "")); e.setConfig(cfg); e.hass = hass; if (cls) e.className = cls; return e; };
// ?view=none: states + hass only, no cards (preview/checks/97-robust.js mounts its own on a clean page).
if (new URLSearchParams(location.search).get("view") !== "none") for (const [cls, item] of layout) {
  if (!Array.isArray(item)) { view.append(mk(item, cls)); continue; }
  const sec = document.createElement("div"); sec.className = "sec " + cls;
  for (const it of item) sec.append(Array.isArray(it) ? mk(it[1], it[0]) : mk(it));
  view.append(sec);
}
window.__ready = true;
</script>
</body>
</html>
